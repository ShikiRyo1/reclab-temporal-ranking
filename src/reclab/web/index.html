<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Recommendation Lab · 推荐与排序实验</title>
<style>
:root{--bg:#f4f5f2;--ink:#17241e;--muted:#607069;--line:#d5ddd6;--green:#17644b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font:15px/1.65 system-ui,"Microsoft YaHei",sans-serif;color:var(--ink)}
main{max-width:1180px;margin:0 auto;padding:36px 34px}header{display:flex;justify-content:space-between;gap:24px;border-bottom:1px solid var(--line);padding-bottom:22px}
.eyebrow{font-size:12px;letter-spacing:2px;color:var(--green);font-weight:700}h1{font-size:34px;line-height:1.25;margin:10px 0}p{margin:8px 0;color:var(--muted)}
nav a{color:var(--green);display:inline-block;margin-left:16px;font-size:13px}.status{font-size:13px}
.grid{display:grid;grid-template-columns:300px 1fr;gap:28px;margin-top:26px}.panel{background:white;border:1px solid var(--line);border-radius:10px;padding:22px}
h2{font-size:19px;margin:0 0 14px}label{display:block;font-weight:600;margin:14px 0 6px}input,select,button{font:inherit}
input,select{width:100%;border:1px solid #bbc8be;border-radius:5px;padding:9px;background:#fff}button{background:var(--green);border:0;color:white;border-radius:5px;padding:11px 16px;cursor:pointer;width:100%;margin-top:18px}
button:disabled{opacity:.55;cursor:wait}.hint{font-size:12px;color:var(--muted)}.pill{display:inline-block;background:#e8f0e9;padding:3px 9px;border-radius:20px;font-size:12px}
#message{min-height:28px;font-size:13px;margin:12px 0}.error{color:#a33421}.meta{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-bottom:14px}
table{width:100%;border-collapse:collapse}th{text-align:left;color:var(--muted);font-size:12px;font-weight:600}th,td{padding:12px 8px;border-bottom:1px solid #e5e9e4}td:first-child{color:var(--green);font-weight:600;width:38px}.movie{font-weight:600}
.sub{display:block;font-size:12px;color:var(--muted)}.score{font-variant-numeric:tabular-nums}
details{margin-top:22px}summary{cursor:pointer;color:var(--green)}pre{background:#eef1ed;padding:15px;overflow:auto;max-height:320px;font-size:12px}
footer{margin-top:28px;font-size:12px;color:var(--muted)}.empty{padding:55px 15px;text-align:center;color:var(--muted)}
@media(max-width:760px){main{padding:22px 16px}.grid{grid-template-columns:1fr}header{display:block}nav a{margin:10px 16px 0 0}h1{font-size:28px}}
</style></head>
<body><main><header><div><div class="eyebrow">RECOMMENDATION LAB / PROJECT 01</div><h1>推荐结果，从证据开始</h1><p>比较个性化排序与冷启动策略，观察相关性和长尾曝光的取舍。</p></div>
<div><div id="status" class="status">正在连接模型…</div><nav><a href="/docs" target="_blank">API 文档</a><a href="/model" target="_blank">模型信息</a><a href="/evidence" target="_blank">评测结果</a></nav></div></header>
<div class="grid"><section class="panel"><h2>生成推荐</h2><form id="form">
<label for="user">用户 ID</label><input id="user" type="number" min="1" placeholder="留空：新用户"><div class="hint">匿名研究数据中的编号。新用户或未知编号使用流行度回退。</div>
<label for="k">推荐数量</label><input id="k" type="number" value="10" min="1" max="50">
<label for="genre">内容类别</label><select id="genre"><option value="">全部类别</option></select>
<label for="novelty">长尾重排权重</label><select id="novelty"><option value="">使用验证集选择的配置</option><option value="0">0 · 原始排序</option><option value="0.05">0.05 · 轻度重排</option><option value="0.1">0.10</option><option value="0.2">0.20</option><option value="0.5">0.50 · 探索对比</option></select>
<div class="hint">手动修改用于探索；评测结论只对应事先锁定的配置。</div><button id="submit" type="submit">生成推荐</button></form><div id="message" role="status"></div></section>
<section class="panel"><h2>推荐列表</h2><div id="meta" class="meta"></div><div id="results" class="empty">输入用户或选择类别，查看真实模型返回的结果。</div>
<details><summary>查看请求与响应 JSON</summary><pre id="raw">尚未发送请求</pre></details></section></div>
<footer>基于 MovieLens 的非商业研究演示。评分不代表完整曝光历史；离线指标不能证明点击率、营收或因果收益。模型分数不是概率。</footer></main>
<script>
const el=id=>document.getElementById(id);
async function initialize(){try{
const [ready,genres]=await Promise.all([fetch('/ready'),fetch('/genres')]);
if(!ready.ok)throw Error('模型尚未就绪，请检查启动日志');const m=await ready.json();
el('status').textContent=m.model_version+' · '+m.n_items+' 部内容';
const g=await genres.json();g.genres.forEach(name=>{const o=document.createElement('option');o.value=name;o.textContent=name;el('genre').append(o)});
}catch(e){el('status').textContent=e.message;el('status').className='error'}}
el('form').addEventListener('submit',async event=>{event.preventDefault();el('submit').disabled=true;el('message').textContent='请求处理中…';el('message').className='';
const request={user_id:el('user').value?Number(el('user').value):null,k:Number(el('k').value),preferred_genres:el('genre').value?[el('genre').value]:[],novelty_weight:el('novelty').value?Number(el('novelty').value):null};
try{const response=await fetch('/recommendations',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(request)});const data=await response.json();
el('raw').textContent=JSON.stringify({request,response:data},null,2);if(!response.ok)throw Error(JSON.stringify(data.detail));
el('message').textContent='已返回 '+data.returned_k+' 项推荐';el('meta').textContent=(data.strategy==='personalized_bpr'?'个性化 BPR':'冷启动回退')+' · 模型 '+data.model_version+' · 推理 '+data.latency_ms+' ms · 权重 '+data.novelty_weight;
const table=document.createElement('table');const head=document.createElement('thead');head.innerHTML='<tr><th>#</th><th>内容与类别</th><th>分数</th></tr>';table.append(head);const body=document.createElement('tbody');
data.recommendations.forEach((row,i)=>{const tr=document.createElement('tr');const rank=document.createElement('td');rank.textContent=i+1;const movie=document.createElement('td');const title=document.createElement('span');title.className='movie';title.textContent=row.title;const sub=document.createElement('span');sub.className='sub';sub.textContent=Array.isArray(row.genres)?row.genres.join(' / '):row.genres;movie.append(title,sub);const score=document.createElement('td');score.className='score';score.textContent=Number(row.score??row.base_score??0).toFixed(4);tr.append(rank,movie,score);body.append(tr)});
table.append(body);el('results').className='';el('results').replaceChildren(table);
if(data.returned_k===0){el('results').textContent='没有符合条件的未看内容。请调整类别或选择其他用户。'}
}catch(e){el('message').textContent='请求失败：'+e.message;el('message').className='error'}finally{el('submit').disabled=false}});
initialize();
</script></body></html>
